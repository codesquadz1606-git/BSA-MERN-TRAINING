<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Product Detail</h1>


    <script>
        let data=new URLSearchParams(window.location.search)
        let id=data.get("id")
        // console.log(id)

        let url=`https://dummyjson.com/products/${id}`
        fetch(url)
        .then((res)=>{
            return res.json()
        })
        .then((data)=>{
            console.log(data)
        })
        .catch((err)=>{
            console.log(err)
        })
    </script>
</body>
</html>
